server.port=8081

basyx.backend = MongoDB

spring.mongodb.host=mongo
spring.mongodb.database=aas-env
spring.mongodb.authentication-database=admin
spring.mongodb.username=mongoAdmin
spring.mongodb.password=mongoPassword

mqtt.clientId=AAS-Env-Example-8081
mqtt.hostname = mqtt
mqtt.port = 1884

# Load the standardized catalog before legacy device blueprints sharing SMT IDs.
basyx.environment=file:aas/CollectionofSMTs.aasx,file:aas/agv.aasx,file:aas/aps.aasx,file:aas/assembly shop.aasx,file:aas/festo-cp-lab.json,file:aas/injection molding machine.aasx,file:aas/machining center.aasx,file:aas/metal 3d printer.aasx,file:aas/process.aasx,file:aas/product battery.aasx,file:aas/production order.aasx,file:aas/robot disassembly.aasx,file:aas/simulation.aasx,file:aas/testing repair station.aasx
basyx.aasrepository.feature.mqtt.enabled = true
basyx.submodelrepository.feature.mqtt.enabled = true
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

basyx.aasrepository.feature.registryintegration = http://aas-registry:8080
basyx.aasrepository.feature.discoveryintegration = http://aas-discovery:8081
basyx.submodelrepository.feature.registryintegration = http://sm-registry:8080
basyx.externalurl = http://localhost:8081
